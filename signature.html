<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #222; line-height: 1.5;">
  <tr>
    <td style="padding-right: 18px; vertical-align: top;">
      <img src="https://raw.githubusercontent.com/iftekharanwar/esign/main/logo.png"
           width="80" alt="COMPEX"
           style="display: block; border: 0; border-radius: 8px;">
    </td>
    <td style="vertical-align: top;">
      <div style="font-size: 16px; font-weight: bold; color: #0D1B2A;">{{NAME}}</div>
      <div style="color: #555; margin-top: 2px;">{{ROLE}} | COMPEX</div>

      <table cellpadding="0" cellspacing="0" border="0" style="margin-top: 10px; font-size: 13px; color: #333;">
        <tr>
          <td style="padding: 2px 6px 2px 0; vertical-align: middle;">
            <img src="https://raw.githubusercontent.com/iftekharanwar/esign/main/icons/phone.png"
                 width="14" height="14" alt="" style="display: block; border: 0;">
          </td>
          <td style="padding: 2px 18px 2px 0; vertical-align: middle;">{{PHONE}}</td>
          <td style="padding: 2px 6px 2px 0; vertical-align: middle;">
            <img src="https://raw.githubusercontent.com/iftekharanwar/esign/main/icons/email.png"
                 width="14" height="14" alt="" style="display: block; border: 0;">
          </td>
          <td style="padding: 2px 0; vertical-align: middle;">
            <a href="mailto:{{EMAIL}}" style="color: #333; text-decoration: none;">{{EMAIL}}</a>
          </td>
        </tr>
        <tr>
          <td style="padding: 2px 6px 2px 0; vertical-align: middle;">
            <img src="https://raw.githubusercontent.com/iftekharanwar/esign/main/icons/website.png"
                 width="14" height="14" alt="" style="display: block; border: 0;">
          </td>
          <td style="padding: 2px 18px 2px 0; vertical-align: middle;">
            <a href="{{WEBSITE}}" style="color: #333; text-decoration: none;">{{WEBSITE_DISPLAY}}</a>
          </td>
          <td style="padding: 2px 6px 2px 0; vertical-align: middle;">
            <img src="https://raw.githubusercontent.com/iftekharanwar/esign/main/icons/linkedin.png"
                 width="14" height="14" alt="" style="display: block; border: 0;">
          </td>
          <td style="padding: 2px 0; vertical-align: middle;">
            <a href="{{LINKEDIN}}" style="color: #333; text-decoration: none;">LinkedIn</a>
          </td>
        </tr>
      </table>

      <div style="margin-top: 12px; font-size: 12px; color: #888;">
        COMPEX &mdash; Unlock sensitive data with full governance.
      </div>
    </td>
  </tr>
</table>
